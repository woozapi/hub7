# fly.toml - Configuração para Fly.io
app = "lumen-crm"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Volume persistente para auth do WhatsApp
[mounts]
  source = "whatsapp_auth"
  destination = "/app/auth_info_baileys"
